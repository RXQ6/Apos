name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build -w @apos/shared
      - run: npm run smoke -w @apos/shared
      - run: npm test -w @apos/shared
      - run: npm run build -w @apos/electron
