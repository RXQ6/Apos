<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>景枢工作台 · Apos Agent</title>
  <style>
    :root {
      --ink: #121614;
      --ink-2: #1a211e;
      --line: #2a332e;
      --text: #e7ebe8;
      --muted: #7d8c84;
      --jade: #2f6f5e;
      --jade-soft: #3d8a74;
      --jade-dim: rgba(47,111,94,.2);
      --cinnabar: #c45c26;
      --paper: #f7f4ee;
      --ok: #3d6b4f;
      --warn: #c45c26;
      --font-display: Georgia, "Songti SC", "SimSun", serif;
      --font-body: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      --font-mono: Consolas, ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 50% at 0% 0%, rgba(47,111,94,.14), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(196,92,38,.08), transparent 50%),
        var(--ink);
      min-height: 100vh;
    }
    .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
    @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .side { display: none; } }
    .side {
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      background: rgba(18,22,20,.92);
      min-height: 0;
    }
    .brand {
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .seal {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(145deg, var(--jade-soft), var(--jade));
      display: grid; place-items: center;
      font-family: var(--font-display); font-weight: 700; color: #fff;
    }
    .brand h1 {
      margin: 0; font-family: var(--font-display);
      font-size: 1.15rem; letter-spacing: .14em; color: #8fbfad;
    }
    .brand p { margin: 4px 0 0; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
    .side-block { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .side-block h2 {
      margin: 0 0 8px; font-size: 11px; letter-spacing: .12em;
      color: var(--muted); font-weight: 500; text-transform: uppercase;
    }
    .modes { display: flex; gap: 6px; }
    .modes button {
      flex: 1; padding: 7px 4px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--ink-2);
      color: #b8c4bc; font-size: 11px; cursor: pointer;
    }
    .modes button:hover { border-color: var(--jade); color: #d5e8df; }
    .modes button.on { background: var(--jade); border-color: var(--jade); color: #fff; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--ink-2); color: var(--text); cursor: pointer; font-size: 13px;
    }
    .btn:hover { border-color: var(--jade); }
    .btn.primary { background: var(--jade); border-color: var(--jade); color: #fff; }
    .btn.primary:hover { background: var(--jade-soft); }
    .btn.block { width: 100%; }
    .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
    .sessions { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
    .sessions li {
      padding: 8px 14px; cursor: pointer; font-size: 12px;
      border-bottom: 1px solid transparent; color: #b8c4bc;
    }
    .sessions li:hover { background: var(--ink-2); }
    .sessions li.on { background: var(--jade-dim); color: #d5e8df; border-left: 2px solid var(--jade); }
    .feat {
      list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; font-size: 12px;
    }
    .feat li { display: flex; gap: 8px; align-items: center; padding: 5px 14px; color: #b8c4bc; }
    .st {
      font-size: 10px; padding: 1px 6px; border-radius: 999px;
      background: #242c28; color: var(--muted); flex-shrink: 0;
    }
    .st-passing { background: var(--ok); color: #d8f0e4; }
    .st-active { background: var(--jade); color: #fff; }
    .st-blocked { background: var(--warn); color: #fff; }
    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .top {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 18px; border-bottom: 1px solid var(--line);
      background: rgba(18,22,20,.7);
    }
    .top .spacer { flex: 1; }
    .chip {
      font-size: 12px; color: var(--muted); padding: 4px 10px;
      border-radius: 999px; border: 1px solid var(--line);
    }
    .chip strong { color: #8fbfad; font-weight: 500; }
    .msgs { flex: 1; overflow: auto; padding: 20px 22px; }
    .msg { max-width: 820px; margin-bottom: 16px; }
    .who { font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: .08em; }
    .body {
      white-space: pre-wrap; line-height: 1.55;
      background: var(--ink-2); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px; font-size: 14px;
    }
    .msg.user .body {
      background: linear-gradient(145deg, #1e3d35, #1a2a24);
      border-color: rgba(47,111,94,.4);
    }
    .msg.tool .body {
      font-family: var(--font-mono); font-size: 12px; color: #a8c4b8;
      border-style: dashed;
    }
    .composer {
      display: flex; gap: 10px; padding: 14px 18px;
      border-top: 1px solid var(--line); background: rgba(18,22,20,.9);
    }
    .composer input {
      flex: 1; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--ink-2); color: var(--text);
      font-size: 14px;
    }
    .composer input:focus {
      outline: none; border-color: var(--jade);
      box-shadow: 0 0 0 3px rgba(47,111,94,.2);
    }
    .empty {
      text-align: center; color: var(--muted); padding: 48px 20px;
      border: 1px dashed var(--line); border-radius: 14px; margin: 20px;
    }
    .empty strong { display: block; color: #8fbfad; font-family: var(--font-display); margin-bottom: 8px; font-size: 1.1rem; }
    .modal-bd {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
      display: grid; place-items: center; padding: 20px;
    }
    .modal {
      width: min(420px, 100%); background: var(--ink-2);
      border: 1px solid var(--line); border-radius: 16px; padding: 22px;
    }
    .modal h3 { margin: 0 0 14px; font-family: var(--font-display); color: #8fbfad; }
    .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .modal input {
      width: 100%; margin-bottom: 10px; padding: 9px 12px;
      border-radius: 8px; border: 1px solid var(--line);
      background: var(--ink); color: var(--text);
    }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a211e; border: 1px solid var(--jade); color: #d5e8df;
      padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 13px;
    }
    a { color: #8fbfad; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="brand-row">
          <div class="seal">枢</div>
          <div>
            <h1>景枢工作台</h1>
            <p>APOS AGENT · 网页版</p>
          </div>
        </div>
      </div>
      <div class="side-block">
        <h2>权限</h2>
        <div class="modes" id="modes">
          <button data-m="explore">explore</button>
          <button data-m="ask">ask</button>
          <button data-m="allow-all">allow-all</button>
        </div>
      </div>
      <div class="side-block" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" id="btnNew">新会话</button>
        <button class="btn sm" id="btnSettings">模型设置</button>
        <a class="btn sm" href="/" style="text-decoration:none">小店</a>
      </div>
      <div class="side-block" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <h2>会话</h2>
        <ul class="sessions" id="sessions"></ul>
      </div>
      <div class="side-block" style="flex:1;display:flex;flex-direction:column;min-height:0;max-height:40%">
        <h2>场景 <span id="featCount"></span></h2>
        <ul class="feat" id="feats"></ul>
      </div>
    </aside>
    <section class="main">
      <div class="top">
        <span class="chip">模式 <strong id="modeChip">ask</strong></span>
        <span class="chip">LLM <strong id="llmChip">echo/工具</strong></span>
        <span class="chip">工具 <strong id="toolChip">—</strong></span>
        <span class="spacer"></span>
        <span class="chip" id="repoChip"></span>
      </div>
      <div class="msgs" id="msgs">
        <div class="empty" id="welcome">
          <strong>景枢 · 电商场景规划智能工作台</strong>
          <div style="max-width:520px;margin:12px auto 0;text-align:left;line-height:1.7">
            Agent 读写的是<strong>真实电商内核</strong>（与小店同库），不是空聊。
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;max-width:640px;margin:16px auto 0;text-align:left">
            <div style="padding:12px;border:1px solid var(--line);border-radius:12px">
              <div style="color:#8fbfad;font-family:var(--font-display)">场景资产</div>
              <div style="font-size:12px;margin-top:4px">40 个可验收场景，harness 可跑</div>
            </div>
            <div style="padding:12px;border:1px solid var(--line);border-radius:12px">
              <div style="color:#8fbfad;font-family:var(--font-display)">业务执行</div>
              <div style="font-size:12px;margin-top:4px">上架/下单/支付/库存立刻生效</div>
            </div>
            <div style="padding:12px;border:1px solid var(--line);border-radius:12px">
              <div style="color:#8fbfad;font-family:var(--font-display)">权限治理</div>
              <div style="font-size:12px;margin-top:4px">explore 禁写，allow-all 全开</div>
            </div>
          </div>
          <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
            <button class="btn sm" data-sample="列出场景">列出场景</button>
            <button class="btn sm" data-sample="搜索红茶">搜索红茶</button>
            <button class="btn sm" data-sample="上架商品 标题=龙井 价格=5900 库存=10">上架商品</button>
            <button class="btn sm" data-sample="创建订单 用户=guest-web sku=sku_tea 数量=1">创建订单</button>
            <button class="btn sm" data-sample="查库存 sku=sku_tea">查库存</button>
            <button class="btn sm" data-sample="跑验证">跑验证</button>
          </div>
          <p style="margin-top:14px;font-size:12px">配 API Key 可自然语言规划；未配置时点上面按钮直接驱动内核。</p>
        </div>
      </div>
      <form class="composer" id="form">
        <input id="input" placeholder="例如：列出 P0 场景 / 搜索红茶 / 创建订单…" autocomplete="off" />
        <button class="btn primary" type="submit" id="send">发送</button>
      </form>
    </section>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <script>
    const state = {
      mode: "ask",
      sessionId: "",
      features: [],
      sessions: [],
      tools: [],
      providers: [],
      busy: false,
    };
    const $ = (id) => document.getElementById(id);
    const msgs = $("msgs");

    function toast(m) {
      $("toastRoot").innerHTML = `<div class="toast">${m}</div>`;
      setTimeout(() => { $("toastRoot").innerHTML = ""; }, 2500);
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      if (!res.ok) throw new Error(data?.message || res.statusText);
      return data;
    }

    function addMsg(role, text) {
      $("welcome")?.remove();
      const el = document.createElement("div");
      el.className = "msg " + role;
      const who = role === "user" ? "你" : role === "tool" ? "工具" : "景枢";
      el.innerHTML = `<div class="who">${who}</div><div class="body">${esc(text)}</div>`;
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
      return el.querySelector(".body");
    }

    function renderSide() {
      $("modeChip").textContent = state.mode;
      document.querySelectorAll("#modes button").forEach((b) => {
        b.classList.toggle("on", b.dataset.m === state.mode);
      });
      $("toolChip").textContent = String(state.tools.length || "—");
      $("featCount").textContent = state.features.length ? `(${state.features.length})` : "";
      $("sessions").innerHTML = state.sessions.map((s) =>
        `<li class="${s.id === state.sessionId ? "on" : ""}" data-sid="${esc(s.id)}">${esc(s.title || s.id)}</li>`
      ).join("") || `<li class="muted" style="color:var(--muted)">暂无</li>`;
      $("sessions").querySelectorAll("[data-sid]").forEach((li) => {
        li.onclick = async () => {
          await api("/api/agent/session/" + li.dataset.sid, { method: "POST" });
          state.sessionId = li.dataset.sid;
          renderSide();
          toast("已切换会话");
        };
      });
      $("feats").innerHTML = state.features.map((f) => {
        const st = f.harnessStatus || "not_started";
        return `<li title="${esc(f.title)}"><span class="st st-${esc(st)}">${esc(st)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.id)}</span></li>`;
      }).join("");
    }

    async function bootstrap() {
      const s = await api("/api/agent/bootstrap");
      state.mode = s.mode;
      state.features = s.features || [];
      state.sessions = s.sessions || [];
      state.tools = s.tools || [];
      state.providers = s.providers || [];
      state.sessionId = s.sessionId || "";
      $("repoChip").textContent = s.repoRoot ? s.repoRoot.split(/[\\/]/).slice(-2).join("/") : "";
      const hasKey = state.providers.some((p) => p.apiKey && p.apiKey !== "***" ? true : p.apiKey);
      $("llmChip").textContent = hasKey ? (state.providers[0]?.model || "LLM") : "echo/工具";
      renderSide();
    }

    document.querySelectorAll("#modes button").forEach((b) => {
      b.onclick = async () => {
        await api("/api/agent/mode", { method: "POST", body: JSON.stringify({ mode: b.dataset.m }) });
        state.mode = b.dataset.m;
        renderSide();
        addMsg("assistant", `权限已切换为 ${state.mode}。`);
      };
    });

    $("btnNew").onclick = async () => {
      const meta = await api("/api/agent/session", { method: "POST" });
      state.sessionId = meta.id;
      await bootstrap();
      addMsg("assistant", "新会话已就绪。");
    };

    $("btnSettings").onclick = () => {
      const p = state.providers[0] || {};
      $("modalRoot").innerHTML = `
        <div class="modal-bd" id="bd">
          <div class="modal">
            <h3>模型通道</h3>
            <label>Provider ID</label><input id="pid" value="${esc(p.id || "anthropic")}" />
            <label>Base URL</label><input id="purl" value="${esc(p.baseUrl || "")}" placeholder="https://..." />
            <label>Model</label><input id="pmodel" value="${esc(p.model || "")}" />
            <label>API Key</label><input id="pkey" type="password" value="" placeholder="sk-..." />
            <div class="row">
              <button class="btn" id="cClose">取消</button>
              <button class="btn primary" id="cSave">保存</button>
            </div>
          </div>
        </div>`;
      $("cClose").onclick = () => { $("modalRoot").innerHTML = ""; };
      $("bd").onclick = (e) => { if (e.target.id === "bd") $("modalRoot").innerHTML = ""; };
      $("cSave").onclick = async () => {
        const providers = [{
          id: $("pid").value.trim(),
          label: $("pid").value.trim(),
          baseUrl: $("purl").value.trim() || undefined,
          model: $("pmodel").value.trim() || undefined,
          apiKey: $("pkey").value || p.apiKey,
        }];
        await api("/api/agent/providers", { method: "POST", body: JSON.stringify({ providers }) });
        $("modalRoot").innerHTML = "";
        await bootstrap();
        toast("Provider 已保存");
      };
    };

    $("form").onsubmit = async (e) => {
      e.preventDefault();
      if (state.busy) return;
      const text = $("input").value.trim();
      if (!text) return;
      $("input").value = "";
      addMsg("user", text);
      state.busy = true;
      $("send").disabled = true;
      $("send").textContent = "…";
      const body = addMsg("assistant", "…");
      try {
        const r = await api("/api/agent/send", { method: "POST", body: JSON.stringify({ text }) });
        let acc = "";
        for (const ev of r.events || []) {
          const p = ev.payload;
          if (ev.type === "token") acc += String(p);
          if (ev.type === "message" && p?.role === "assistant") acc = String(p.text || acc);
          if (ev.type === "message" && p?.role === "tool") {
            addMsg("tool", typeof p.text === "string" ? p.text : JSON.stringify(p));
          }
          if (ev.type === "error") addMsg("tool", "错误: " + String(p));
          if (ev.type === "mode") {
            $("llmChip").textContent = p?.llm ? (p.provider || "LLM") : "echo/工具";
          }
        }
        body.textContent = acc || "(完成)";
        await bootstrap();
      } catch (err) {
        body.textContent = "失败：" + err.message;
      } finally {
        state.busy = false;
        $("send").disabled = false;
        $("send").textContent = "发送";
        msgs.scrollTop = msgs.scrollHeight;
      }
    };

    bootstrap().catch((e) => {
      $("msgs").innerHTML = `<div class="empty"><strong>无法连接服务</strong>${esc(e.message)}<div style="margin-top:12px">请先运行 <code>npm.cmd run web</code></div></div>`;
    });

    $("msgs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-sample]");
      if (!b) return;
      $("input").value = b.dataset.sample;
      $("form").dispatchEvent(new Event("submit", { cancelable: true }));
    });
  </script>
</body>
</html>
