<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>景枢小店 · Apos</title>
  <style>
    :root {
      --ink: #1a1f1c;
      --ink-soft: #3d4540;
      --muted: #6b7c6e;
      --paper: #f7f4ee;
      --paper-2: #efeae0;
      --card: #fffdf8;
      --line: #e4ddd0;
      --jade: #2f6f5e;
      --jade-deep: #1f4d41;
      --jade-soft: #e8f0ec;
      --cinnabar: #c45c26;
      --cinnabar-soft: #f8ebe3;
      --gold: #a67c3d;
      --danger: #a33b2b;
      --shadow: 0 10px 30px rgba(26, 31, 28, 0.06);
      --radius: 14px;
      --font-display: Georgia, "Songti SC", "SimSun", "Noto Serif SC", serif;
      --font-body: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      --font-data: "SF Mono", Consolas, ui-monospace, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(47,111,94,.08), transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(196,92,38,.06), transparent 45%),
        var(--paper);
      line-height: 1.55;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
      z-index: 0;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: var(--jade); text-decoration: none; }
    :focus-visible {
      outline: 2px solid var(--jade);
      outline-offset: 2px;
      border-radius: 6px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* —— Shell —— */
    .shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; gap: 16px;
      padding: 12px 28px;
      background: rgba(247,244,238,.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-display);
      font-size: 1.25rem; letter-spacing: .12em;
      color: var(--jade-deep);
      flex-shrink: 0;
    }
    .seal {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(145deg, var(--jade), var(--jade-deep));
      color: #f7f4ee;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700;
      box-shadow: 0 4px 12px rgba(47,111,94,.35);
    }
    .brand em { font-style: normal; color: var(--cinnabar); font-size: .7em; letter-spacing: .2em; display: block; }
    .nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
    .nav button {
      padding: 8px 14px; border-radius: 999px;
      color: var(--ink-soft); font-size: .92rem;
      transition: background .15s, color .15s;
    }
    .nav button:hover { background: var(--jade-soft); color: var(--jade-deep); }
    .nav button.on { background: var(--jade); color: #fff; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .badge-btn {
      position: relative;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card);
      font-size: .88rem;
    }
    .badge-btn:hover { border-color: var(--jade); color: var(--jade-deep); }
    .badge-btn .n {
      position: absolute; top: -6px; right: -6px;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 999px; background: var(--cinnabar); color: #fff;
      font-size: 11px; font-family: var(--font-data);
      display: grid; place-items: center;
    }
    .auth-pill {
      padding: 6px 12px; border-radius: 999px;
      background: var(--jade-soft); color: var(--jade-deep);
      font-size: .8rem; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .main { flex: 1; width: min(1180px, 100%); margin: 0 auto; padding: 28px 20px 80px; }
    .footer {
      border-top: 1px solid var(--line); padding: 20px;
      text-align: center; color: var(--muted); font-size: .82rem;
      font-family: var(--font-display); letter-spacing: .08em;
    }

    /* —— Components —— */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px;
      font-size: .95rem; font-weight: 500;
      transition: transform .12s, background .15s, box-shadow .15s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: var(--jade); color: #fff;
      box-shadow: 0 6px 16px rgba(47,111,94,.25);
    }
    .btn-primary:hover { background: var(--jade-deep); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
    }
    .btn-ghost:hover { border-color: var(--jade); color: var(--jade-deep); background: var(--jade-soft); }
    .btn-danger { background: var(--cinnabar); color: #fff; }
    .btn-danger:hover { filter: brightness(.95); }
    .btn-sm { padding: 6px 12px; font-size: .85rem; border-radius: 8px; }
    .btn-block { width: 100%; }
    .field {
      display: flex; flex-direction: column; gap: 6px;
    }
    .field label { font-size: .82rem; color: var(--muted); letter-spacing: .04em; }
    .field input, .field select, .field textarea {
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--card);
      color: var(--ink);
    }
    .field input:focus, .field select:focus {
      border-color: var(--jade); outline: none;
      box-shadow: 0 0 0 3px rgba(47,111,94,.15);
    }
    .panel {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow);
    }
    .panel h2, .panel h3 {
      margin: 0 0 14px; font-family: var(--font-display);
      font-weight: 600; letter-spacing: .06em; color: var(--jade-deep);
    }
    .grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } .topbar { flex-wrap: wrap; padding: 10px 14px; } .nav { order: 3; width: 100%; } }
    .muted { color: var(--muted); font-size: .9rem; }
    .price { font-family: var(--font-data); color: var(--cinnabar); font-weight: 600; }
    .price-lg { font-size: 1.35rem; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      font-size: .75rem; background: var(--jade-soft); color: var(--jade-deep);
    }
    .pill.warn { background: var(--cinnabar-soft); color: var(--cinnabar); }
    .pill.mute { background: var(--paper-2); color: var(--muted); }
    .empty {
      text-align: center; padding: 48px 20px; color: var(--muted);
      border: 1px dashed var(--line); border-radius: var(--radius);
      background: rgba(255,253,248,.5);
    }
    .empty strong { display: block; color: var(--ink-soft); margin-bottom: 6px; font-family: var(--font-display); }
    .toast-wrap {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100% - 32px));
    }
    .toast {
      padding: 12px 16px; border-radius: 12px;
      background: var(--ink); color: #f7f4ee;
      box-shadow: 0 12px 32px rgba(0,0,0,.2);
      font-size: .9rem;
      animation: rise .25s ease;
    }
    .toast.err { background: var(--danger); }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* —— Home / catalog —— */
    .hero {
      display: grid; grid-template-columns: 1.2fr .8fr; gap: 24px;
      margin-bottom: 28px; padding: 32px;
      border-radius: 20px;
      background:
        linear-gradient(135deg, rgba(47,111,94,.12), transparent 50%),
        var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    @media (max-width: 800px) { .hero { grid-template-columns: 1fr; padding: 22px; } }
    .hero h1 {
      margin: 0 0 10px; font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 600;
      letter-spacing: .08em; color: var(--jade-deep); line-height: 1.3;
    }
    .hero p { margin: 0 0 18px; color: var(--ink-soft); max-width: 36em; }
    .hero-art {
      min-height: 160px; border-radius: 16px;
      background:
        repeating-linear-gradient(90deg, transparent, transparent 18px, rgba(47,111,94,.06) 18px, rgba(47,111,94,.06) 19px),
        linear-gradient(160deg, var(--jade-soft), var(--paper-2));
      border: 1px solid var(--line);
      display: grid; place-items: center; position: relative; overflow: hidden;
    }
    .hero-art span {
      font-family: var(--font-display); font-size: 2.4rem;
      letter-spacing: .4em; color: var(--jade); opacity: .7;
      writing-mode: vertical-rl;
    }
    .toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center;
    }
    .toolbar input[type="search"] {
      flex: 1; min-width: 180px; padding: 10px 14px;
      border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    }
    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
    }
    .product-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      box-shadow: var(--shadow);
    }
    .product-card:hover { transform: translateY(-2px); border-color: rgba(47,111,94,.35); }
    .product-thumb {
      height: 120px; display: grid; place-items: center;
      font-family: var(--font-display); font-size: 1.5rem; letter-spacing: .2em;
      color: var(--jade-deep);
      background:
        linear-gradient(145deg, var(--jade-soft), var(--paper-2));
      border-bottom: 1px solid var(--line);
    }
    .product-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .product-body h3 {
      margin: 0; font-size: 1rem; font-weight: 600; font-family: var(--font-display); letter-spacing: .04em;
    }
    .product-body .meta { font-size: .8rem; color: var(--muted); }
    .product-actions { display: flex; gap: 8px; margin-top: auto; }

    /* —— Detail —— */
    .detail-layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: 24px; }
    @media (max-width: 800px) { .detail-layout { grid-template-columns: 1fr; } }
    .detail-art {
      aspect-ratio: 1; border-radius: 18px;
      background: linear-gradient(160deg, var(--jade-soft), var(--paper-2));
      border: 1px solid var(--line);
      display: grid; place-items: center;
      font-family: var(--font-display); font-size: 3rem; color: var(--jade); letter-spacing: .3em;
    }
    .sku-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--line);
    }
    .qty {
      display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    }
    .qty button { width: 36px; height: 36px; background: var(--paper-2); }
    .qty button:hover { background: var(--jade-soft); color: var(--jade-deep); }
    .qty span { min-width: 36px; text-align: center; font-family: var(--font-data); }

    /* —— Cart / checkout —— */
    .line-row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
      padding: 14px 0; border-bottom: 1px solid var(--line);
    }
    .line-row:last-child { border-bottom: none; }
    .sum-row {
      display: flex; justify-content: space-between; padding: 6px 0; font-size: .95rem;
    }
    .sum-row.total {
      margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 1.1rem; font-weight: 600;
    }
    .step-bar {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .step {
      padding: 6px 14px; border-radius: 999px; font-size: .85rem;
      background: var(--paper-2); color: var(--muted);
    }
    .step.on { background: var(--jade); color: #fff; }
    .step.done { background: var(--jade-soft); color: var(--jade-deep); }

    /* —— Orders —— */
    .order-card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow);
    }
    .order-card header {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--line);
    }
    .order-id { font-family: var(--font-data); font-size: .8rem; color: var(--muted); }
    .order-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    /* —— Account —— */
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button {
      padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
      font-size: .88rem; background: var(--card);
    }
    .tabs button.on { background: var(--jade); border-color: var(--jade); color: #fff; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(26,31,28,.4); z-index: 50;
      display: grid; place-items: center; padding: 20px;
    }
    .modal {
      width: min(400px, 100%); background: var(--card); border-radius: 16px;
      padding: 24px; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.2);
    }
    .modal h3 { margin: 0 0 16px; font-family: var(--font-display); color: var(--jade-deep); }
    .modal .fields { display: flex; flex-direction: column; gap: 12px; }
    .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="景枢小店">
        <div class="seal" aria-hidden="true">枢</div>
        <div>景枢小店<em>APOS · TEA &amp; CRAFT</em></div>
      </div>
      <nav class="nav" id="nav" aria-label="主导航">
        <button data-view="home" class="on">选物</button>
        <button data-view="cart">购物车</button>
        <button data-view="checkout">结算</button>
        <button data-view="orders">订单</button>
        <button data-view="account">我的</button>
      </nav>
      <div class="top-actions">
        <button type="button" class="badge-btn" id="btnCart" aria-label="购物车">
          车 <span class="n" id="cartN" hidden>0</span>
        </button>
        <span class="auth-pill" id="authPill">未登录</span>
        <button type="button" class="btn btn-ghost btn-sm" id="btnAuth">登录</button>
      </div>
    </header>
    <main class="main" id="app" aria-live="polite"></main>
    <footer class="footer">景枢 · 本地沙箱支付演示 · 数据落在本机 SQLite</footer>
  </div>
  <div class="toast-wrap" id="toasts"></div>
  <div id="modalRoot"></div>

  <script>
    /* ========== State ========== */
    const state = {
      view: "home",
      token: localStorage.getItem("apos_token") || "",
      customerId: localStorage.getItem("apos_cid") || "",
      guestId: localStorage.getItem("apos_guest") || `g_${Math.random().toString(36).slice(2, 8)}`,
      products: [],
      cart: { lines: [] },
      lastOrder: null,
      lastPaymentId: "",
      accountTab: "addr",
      detailSpu: null,
      detailQty: 1,
      selectedSku: "",
      quote: null,
      checkoutAddr: "",
      couponId: localStorage.getItem("apos_coupon") || "",
    };
    localStorage.setItem("apos_guest", state.guestId);

    const $ = (id) => document.getElementById(id);
    const app = $("app");

    function yuan(c) {
      return "¥" + (Number(c || 0) / 100).toFixed(2);
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }
    function toast(msg, err) {
      const el = document.createElement("div");
      el.className = "toast" + (err ? " err" : "");
      el.textContent = msg;
      $("toasts").appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
    function setAuthPill() {
      $("authPill").textContent = state.token
        ? (state.customerId ? state.customerId.slice(0, 12) + "…" : "已登录")
        : "游客 · " + state.guestId;
      $("btnAuth").textContent = state.token ? "退出" : "登录";
    }
    function setCartBadge() {
      const n = (state.cart?.lines || []).reduce((s, l) => s + (l.checked ? l.qty : 0), 0);
      const el = $("cartN");
      el.hidden = n === 0;
      el.textContent = String(n);
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (!state.token || path.startsWith("/api/auth/")) headers["X-Guest-Id"] = state.guestId;
      let res;
      try {
        res = await fetch(path, { ...options, headers });
      } catch {
        const e = new Error("网络异常，请确认小店服务已启动");
        e.code = "NETWORK";
        throw e;
      }
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
      if (!res.ok) {
        const err = new Error(data?.message || res.statusText || "请求失败");
        err.code = data?.code || "HTTP_" + res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    /* ========== Auth ========== */
    function openAuthModal() {
      if (state.token) {
        api("/api/auth/logout", { method: "POST" }).catch(() => {});
        state.token = "";
        state.customerId = "";
        localStorage.removeItem("apos_token");
        localStorage.removeItem("apos_cid");
        setAuthPill();
        toast("已退出登录");
        go("home");
        return;
      }
      $("modalRoot").innerHTML = `
        <div class="modal-backdrop" id="authBd">
          <div class="modal" role="dialog" aria-labelledby="authT">
            <h3 id="authT">登录 / 注册</h3>
            <div class="fields">
              <div class="field"><label for="acc">账号</label><input id="acc" value="buyer@apos.local" autocomplete="username" /></div>
              <div class="field"><label for="pwd">密码（至少 6 位）</label><input id="pwd" type="password" value="secret1" autocomplete="current-password" /></div>
            </div>
            <div class="row">
              <button type="button" class="btn btn-ghost" id="authCancel">取消</button>
              <button type="button" class="btn btn-primary" id="authLogin">登录</button>
              <button type="button" class="btn btn-ghost" id="authReg">注册</button>
            </div>
          </div>
        </div>`;
      const close = () => { $("modalRoot").innerHTML = ""; };
      $("authCancel").onclick = close;
      $("authBd").onclick = (e) => { if (e.target.id === "authBd") close(); };
      async function doAuth(kind) {
        try {
          const body = JSON.stringify({ account: $("acc").value.trim(), password: $("pwd").value });
          const r = await api("/api/auth/" + kind, { method: "POST", body });
          state.token = r.sessionToken;
          state.customerId = r.customerId;
          localStorage.setItem("apos_token", state.token);
          localStorage.setItem("apos_cid", state.customerId);
          setAuthPill();
          await refreshCart();
          close();
          toast(kind === "login" ? "登录成功" : "注册并登录成功");
          go(state.view === "home" ? "home" : state.view);
        } catch (e) {
          toast(e.message, true);
        }
      }
      $("authLogin").onclick = () => doAuth("login");
      $("authReg").onclick = () => doAuth("register");
    }

    async function ensureLogin() {
      if (state.token) return true;
      openAuthModal();
      return false;
    }

    /* ========== Data ========== */
    async function loadProducts(q) {
      const path = "/api/catalog/search" + (q ? `?q=${encodeURIComponent(q)}` : "");
      state.products = await api(path);
    }
    async function refreshCart() {
      try {
        state.cart = await api("/api/cart");
      } catch {
        state.cart = { lines: [] };
      }
      setCartBadge();
    }

    /* ========== Views ========== */
    function go(view, opts = {}) {
      state.view = view;
      if (opts.spuId) state.detailSpu = opts.spuId;
      document.querySelectorAll("#nav button").forEach((b) => {
        b.classList.toggle(
          "on",
          b.dataset.view === view ||
            (view === "detail" && b.dataset.view === "home") ||
            (view === "pay" && b.dataset.view === "checkout"),
        );
      });
      void render();
    }

    async function render() {
      try {
        if (state.view === "home") await viewHome();

        await api("/api/cart/items", { method: "POST", body: JSON.stringify({ skuId: sku.id, qty: 1 }) });
        await refreshCart();
        toast(`已加入购物车 · ${d.spu.title}`);
      } catch (e) { toast(e.message, true); }
    }

      if (!spuId) return go("home");
      const d = await api(`/api/catalog/spus/${spuId}`);

      }

    async function viewCart() {
      await refreshCart();
      const lines = state.cart.lines || [];
      app.innerHTML = `
        <div class="panel">
          <h2>购物车</h2>
          ${!lines.length ? `<div class="empty"><strong>车是空的</strong>去「选物」挑几件好东西。<div style="margin-top:14px"><button class="btn btn-primary" data-nav="home">去逛逛</button></div></div>` : lines.map((l) => `

        row.querySelector('[data-act="inc"]').onclick = () => updateLine(id, { qty: line.qty + 1 });
        row.querySelector('[data-act="dec"]').onclick = () => updateLine(id, { qty: Math.max(1, line.qty - 1) });

    async function placeOrder(ready) {

          method: "POST",
          body: JSON.stringify({ orderId: order.id }),

        go("pay");
      } catch (e) {
        toast(e.message, true);

      if (!state.token) {

        return `<span class="pill mute">${esc(s)}</span>`;
      };
      app.innerHTML = `
        <div class="panel">
          <h2>我的订单</h2>
          ${!list.length ? `<div class="empty"><strong>暂无订单</strong>完成一笔沙箱支付试试。<div style="margin-top:14px"><button class="btn btn-primary" data-nav="home">去选物</button></div></div>` :
          list.map((o) => `
            <article class="order-card" data-oid="${esc(o.id)}">
              <header>
                <span class="order-id">${esc(o.id)}</span>
                ${statusPill(o.status)}
              </header>
              <div class="price">${yuan(o.payAmountCents)}</div>

      app.querySelectorAll("[data-repay]").forEach((b) => {

            void viewOrders();
          } catch (e) { toast(e.message, true); }
        };
      });
    }

            <button class="btn btn-ghost btn-sm" id="mkCoupon">创建演示券 OFF100</button>
            <button class="btn btn-primary btn-sm" id="recvCoupon">领取 OFF100</button>
          </div>
          <p class="muted">领取后把实例 ID 填到结算页「优惠券」栏，可抵扣 100 分。</p>
          <div id="couponOut" class="muted" style="margin-top:10px"></div>`;
        $("mkCoupon").onclick = async () => {
          try {
            const r = await api("/api/pricing/coupons", {
              method: "POST",
              body: JSON.stringify({ code: "OFF100", title: "减100", discountCents: 100, totalStock: 100 }),
            });
            $("couponOut").textContent = "已创建 " + r.code;
            toast("券模板已创建");
          } catch (e) { toast(e.message, true); }
        };
        $("recvCoupon").onclick = async () => {
          try {
            const r = await api("/api/me/coupons/receive", {
              method: "POST",
              body: JSON.stringify({ code: "OFF100" }),
            });
            state.couponId = r.couponInstanceId;
            localStorage.setItem("apos_coupon", state.couponId);
            $("couponOut").textContent = "已领取：" + r.couponInstanceId;
            toast("领取成功，结算时自动带入");
          } catch (e) { toast(e.message, true); }
        };
      } else {
        body.innerHTML = `
          <div class="field"><label for="sid">发货单 ID</label><input id="sid" placeholder="订单发货后获得" /></div>
          <button class="btn btn-primary" id="tr" style="margin-top:12px">查询轨迹</button>
          <div id="trOut" style="margin-top:14px"></div>`;
        $("tr").onclick = async () => {
          try {
            const t = await api(`/api/fulfillments/${$("sid").value.trim()}`);
            $("trOut").innerHTML = (t.nodes || []).map((n) =>
              `<div class="line-row"><span>${new Date(n.time).toLocaleString()}</span><span class="pill">${esc(n.status)}</span><span class="muted">${esc(n.desc)}</span></div>`
            ).join("") || `<div class="muted">暂无节点</div>`;
          } catch (e) { toast(e.message, true); }
        };
      }
    }

    $("nav").querySelectorAll("button").forEach((b) => {
      b.onclick = () => go(b.dataset.view);
    });
    $("btnCart").onclick = () => go("cart");
    $("btnAuth").onclick = openAuthModal;

    setAuthPill();
    refreshCart().then(() => go("home")).catch(() => go("home"));
  </script>
</body>
</html>
